<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Automation</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 50px auto;
      padding: 20px;
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
    }

    .box {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 25px;
      margin-top: 25px;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 15px;
    }

    #videoFile {
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <h1>YouTube Automation</h1>
  <p>Upload your video to YouTube</p>

  <div class="box">
    <h2>Video Upload</h2>

    <input type="file" id="videoFile" accept="video/*">

    <br>

    <input
      type="text"
      id="title"
      placeholder="Video title"
      style="padding:10px; width:90%; margin-top:15px;"
    >

    <br>

    <button onclick="connectYouTube()">
      Connect YouTube
    </button>

    <p id="status">Not connected</p>
  </div>

  <script>
    function connectYouTube() {
      document.getElementById("status").textContent =
        "YouTube connection will be added next.";
    }
  </script>

</body>
</html>
