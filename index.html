<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>YouTube Automation</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 40px auto;
      padding: 20px;
      text-align: center;
    }

    .box {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 25px;
      margin-top: 25px;
    }

    input, textarea, select {
      width: 90%;
      padding: 12px;
      margin-top: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      box-sizing: border-box;
    }

    textarea {
      height: 100px;
      resize: vertical;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 15px;
    }

    #uploadButton {
      display: none;
    }

    #status {
  margin-top: 20px;
  font-weight: bold;
}

#scriptOutput {
  width: 90%;
  min-height: 220px;
  margin-top: 15px;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 15px;
  box-sizing: border-box;
  resize: vertical;
}
</style>

  <script src="https://accounts.google.com/gsi/client"
          async defer></script>
</head>

<body>

  <h1>YouTube Automation</h1>
  <p>Upload your video to YouTube</p>

  <div class="box">

    <h2>YouTube Connection</h2>

    <button onclick="connectYouTube()">
      Connect YouTube
    </button>

    <br>

    <input
      type="file"
      id="videoFile"
      accept="video/*"
    >

    <input
      type="text"
      id="title"
      placeholder="Video title"
    >

    <textarea
      id="description"
      placeholder="Video description"
    ></textarea>

    <select id="privacy">
      <option value="private">Private</option>
      <option value="unlisted">Unlisted</option>
    </select>

    <br>

    <button id="uploadButton" onclick="uploadVideo()">
      Upload to YouTube
    </button>

    <p id="status">Not connected</p>

</div>

<div class="box">
  <h2>AI Script Generator</h2>

  <input
    type="text"
    id="scriptTopic"
    placeholder="Enter video topic"
  >

  <select id="scriptLanguage">
    <option value="English">English</option>
    <option value="Hindi">Hindi</option>
    <option value="Hinglish">Hinglish</option>
  </select>

  <select id="scriptLength">
    <option value="30 seconds">30 seconds</option>
    <option value="60 seconds">60 seconds</option>
    <option value="2 minutes">2 minutes</option>
    <option value="5 minutes">5 minutes</option>
  </select>

  <br>

  <button onclick="generateScript()">
    Generate Script
  </button>

  <textarea
    id="scriptOutput"
    placeholder="Your script will appear here..."
    readonly
  ></textarea>

  <p id="scriptStatus"></p>
</div>

<script>

    const CLIENT_ID =
      "267300896744-3lsm5m5f1aivm228hr6bvr0tihq22kg0.apps.googleusercontent.com";

    const SCOPES =
      "https://www.googleapis.com/auth/youtube.upload";

    let tokenClient;
    let accessToken = null;

    window.onload = function () {

      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPES,

        callback: function (response) {

          if (response.error !== undefined) {
            document.getElementById("status").textContent =
              "Connection failed.";
            console.log(response);
            return;
          }

          accessToken = response.access_token;

          document.getElementById("status").textContent =
            "YouTube connected successfully!";

          document.getElementById("uploadButton").style.display =
            "inline-block";
        }
      });

    };


    function connectYouTube() {

      if (!tokenClient) {
        document.getElementById("status").textContent =
          "Google is loading. Please try again.";
        return;
      }

      document.getElementById("status").textContent =
        "Connecting to Google...";

      tokenClient.requestAccessToken({
        prompt: "consent"
      });

    }


        async function uploadVideo() {

      if (!accessToken) {
        alert("Please connect YouTube first.");
        return;
      }

      const file = document.getElementById("videoFile").files[0];
      const title = document.getElementById("title").value.trim();
      const description = document.getElementById("description").value.trim();
      const privacy = document.getElementById("privacy").value;
      const status = document.getElementById("status");

      if (!file) {
        alert("Please select a video.");
        return;
      }

      if (!title) {
        alert("Please enter a video title.");
        return;
      }

      status.textContent = "Starting upload...";

      const metadata = {
        snippet: {
          title: title,
          description: description,
          categoryId: "22"
        },
        status: {
          privacyStatus: privacy
        }
      };

      try {

        // Start resumable upload session
        const startResponse = await fetch(
          "https://www.googleapis.com/upload/youtube/v3/videos?uploadType=resumable&part=snippet,status",
          {
            method: "POST",

            headers: {
              "Authorization": "Bearer " + accessToken,
              "Content-Type": "application/json; charset=UTF-8",
              "X-Upload-Content-Length": file.size,
              "X-Upload-Content-Type": file.type || "video/*"
            },

            body: JSON.stringify(metadata)
          }
        );

        if (!startResponse.ok) {
          const errorText = await startResponse.text();
          console.log(errorText);
          status.textContent = "Could not start upload.";
          return;
        }

        const uploadUrl = startResponse.headers.get("Location");

        if (!uploadUrl) {
          status.textContent = "Upload URL was not received.";
          return;
        }

        // Upload in 5 MB chunks
        const chunkSize = 5 * 1024 * 1024;
        let start = 0;

        while (start < file.size) {

          const end = Math.min(
            start + chunkSize,
            file.size
          ) - 1;

          const chunk = file.slice(start, end + 1);

          status.textContent =
            "Uploading video... " +
            Math.floor((start / file.size) * 100) +
            "%";

          const uploadResponse = await fetch(
            uploadUrl,
            {
              method: "PUT",

              headers: {
                "Authorization": "Bearer " + accessToken,
                "Content-Length": chunk.size,
                "Content-Type": file.type || "video/*",
                "Content-Range":
                  "bytes " +
                  start +
                  "-" +
                  end +
                  "/" +
                  file.size
              },

              body: chunk
            }
          );

          if (
            uploadResponse.status === 200 ||
            uploadResponse.status === 201
          ) {

            const data = await uploadResponse.json();

            status.innerHTML =
              "🎉 Video uploaded successfully!<br>" +
              "Video ID: " + data.id;

            return;
          }

          if (uploadResponse.status === 308) {

            const range =
              uploadResponse.headers.get("Range");

            if (range) {
              const lastByte =
                parseInt(range.split("-")[1], 10);

              start = lastByte + 1;
            } else {
              start = end + 1;
            }

            continue;
          }

          const errorText = await uploadResponse.text();
          console.log(errorText);

          status.textContent =
            "Upload failed: " +
            uploadResponse.status;

          return;
        }

      } catch (error) {

        console.log(error);

        status.textContent =
          "Upload interrupted. Please try again.";
      }
    }

function generateScript() {
  const topic = document.getElementById("scriptTopic").value.trim();
  const language = document.getElementById("scriptLanguage").value;
  const length = document.getElementById("scriptLength").value;

  const output = document.getElementById("scriptOutput");
  const status = document.getElementById("scriptStatus");

  if (!topic) {
    alert("Please enter a video topic.");
    return;
  }

  status.textContent = "Generating AI script...";
  output.value = "";

  const callbackName =
    "aiScriptCallback_" + Date.now();

  const backendUrl =
    "https://script.google.com/macros/s/AKfycbzH-Z9SvwP_OxTM8sYIiAk0RWG0c4la8jIS3MhdVh17XUR88ZOq7RhNHkqLErQByvTs7g/exec";

  const script = document.createElement("script");

  window[callbackName] = function(data) {
    if (data.success) {
      output.value = data.script;
      status.textContent = "Script generated successfully!";
    } else {
      output.value = "";
      status.textContent = "Error: " + data.error;
    }

    delete window[callbackName];
    script.remove();
  };

  script.onerror = function() {
    status.textContent = "Could not connect to AI backend.";
    delete window[callbackName];
    script.remove();
  };

  const url =
    backendUrl +
    "?callback=" + encodeURIComponent(callbackName) +
    "&topic=" + encodeURIComponent(topic) +
    "&language=" + encodeURIComponent(language) +
    "&length=" + encodeURIComponent(length);

  script.src = url;

  document.body.appendChild(script);
}

</script>

</body>
</html>
